<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 역대짬뽕 관리시스템</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">역대짬뽕</h1>
                <p class="login-subtitle">프랜차이즈 관리 시스템</p>
            </div>

            <div id="loginNotice" class="login-error" style="display:none;"></div>

            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="login-input-group">
                    <label for="passwordInput" class="login-label">비밀번호</label>
                    <input
                        type="password"
                        id="passwordInput"
                        class="login-input"
                        placeholder="비밀번호를 입력하세요"
                        autofocus
                        required
                    >
                </div>
                <div id="loginError" class="login-error" style="display:none;">
                    비밀번호가 올바르지 않습니다.
                </div>
                <button type="submit" class="login-btn" id="loginBtn">로그인</button>
            </form>

            <div class="login-footer">
                <p>본사 관리자 전용 시스템입니다.</p>
            </div>
        </div>
    </div>

    <script src="auth-config.js"></script>
    <script>
        (function() {
            var form = document.getElementById('loginForm');
            var input = document.getElementById('passwordInput');
            var errorEl = document.getElementById('loginError');
            var noticeEl = document.getElementById('loginNotice');
            var btn = document.getElementById('loginBtn');

            function getReason() {
                try {
                    var params = new URLSearchParams(location.search || '');
                    return params.get('reason') || '';
                } catch (e) {
                    return '';
                }
            }

            function showNotice(msg) {
                if (!noticeEl) return;
                noticeEl.textContent = msg;
                noticeEl.style.display = 'block';
            }

            function disableForm() {
                if (input) input.disabled = true;
                if (btn) btn.disabled = true;
            }

            function isAuthUsable() {
                if (typeof AUTH_CONFIG === 'undefined') return { ok: false, reason: 'config_missing' };
                if (AUTH_CONFIG && AUTH_CONFIG.disabled === true) return { ok: false, reason: 'auth_disabled' };
                if (!AUTH_CONFIG.password_hash || !AUTH_CONFIG.session_token) return { ok: false, reason: 'config_invalid' };
                return { ok: true, reason: '' };
            }

            // reason 안내 메시지
            var reason = getReason();
            if (reason === 'logged_out') {
                showNotice('로그아웃 되었습니다.');
            } else if (reason === 'not_authenticated') {
                showNotice('로그인이 필요합니다.');
            } else if (reason === 'config_missing') {
                showNotice('인증 설정 파일을 불러올 수 없습니다. 배포 상태를 확인하세요.');
            } else if (reason === 'auth_disabled') {
                showNotice('비밀번호 인증이 설정되지 않았습니다. 관리자에게 DASHBOARD_PASSWORD 설정 및 재배포를 요청하세요.');
            } else if (reason === 'config_invalid') {
                showNotice('인증 설정이 올바르지 않습니다. 관리자에게 재배포를 요청하세요.');
            }

            // 인증 설정 자체 점검 (설정이 없으면 로그인 시도 자체를 막음)
            var authState = isAuthUsable();
            if (!authState.ok) {
                disableForm();
                if (!reason) {
                    if (authState.reason === 'config_missing') {
                        showNotice('인증 설정 파일을 불러올 수 없습니다. 배포 상태를 확인하세요.');
                    } else if (authState.reason === 'auth_disabled') {
                        showNotice('비밀번호 인증이 설정되지 않았습니다. 관리자에게 DASHBOARD_PASSWORD 설정 및 재배포를 요청하세요.');
                    } else {
                        showNotice('인증 설정이 올바르지 않습니다. 관리자에게 재배포를 요청하세요.');
                    }
                }
                return;
            }

            // 이미 로그인되어 있으면 리다이렉트
            var token = sessionStorage.getItem('auth_token');
            if (token && token === AUTH_CONFIG.session_token) {
                location.href = 'index.html';
                return;
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                errorEl.style.display = 'none';
                btn.disabled = true;
                btn.textContent = '확인 중...';

                var pw = input.value;
                if (!pw) {
                    errorEl.textContent = '비밀번호를 입력하세요.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '로그인';
                    return;
                }

                try {
                    var hash = await sha256(pw);

                    if (hash === AUTH_CONFIG.password_hash) {
                        sessionStorage.setItem('auth_token', AUTH_CONFIG.session_token);
                        location.href = 'index.html';
                    } else {
                        errorEl.textContent = '비밀번호가 올바르지 않습니다.';
                        errorEl.style.display = 'block';
                        input.value = '';
                        input.focus();
                    }
                } catch (err) {
                    errorEl.textContent = '오류가 발생했습니다.';
                    errorEl.style.display = 'block';
                }

                btn.disabled = false;
                btn.textContent = '로그인';
            });

            async function sha256(message) {
                var msgBuffer = new TextEncoder().encode(message);
                var hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                var hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            }
        })();
    </script>
</body>
</html>
