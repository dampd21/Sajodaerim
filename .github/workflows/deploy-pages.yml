name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'output/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare docs folder
        run: |
          set -e

          if [ -f "output/report_data.json" ]; then
            cp output/report_data.json docs/
          fi

          cat > docs/ai-config.js << 'AIEOF'
          const AI_CONFIG = {
            AI_MODE: "direct",
            GEMINI_PROXY_URL: "",
            GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}",
            GEMINI_API_URL: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"
          };
          AIEOF

          echo "AI config file created (direct mode)"

      - name: Generate auth-config.js
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -e

          mkdir -p docs

          if [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::warning::DASHBOARD_PASSWORD not set. Creating fallback auth-config with clear message."
            cat > docs/auth-config.js << 'AUTHEOF'
          var AUTH_CONFIG = {
            disabled: true,
            password_hash: "",
            session_token: "",
            generated_at: "",
            message: "DASHBOARD_PASSWORD 시크릿이 설정되지 않았습니다."
          };
          AUTHEOF
          else
            HASH=$(echo -n "$DASHBOARD_PASSWORD" | sha256sum | awk '{print $1}')
            TOKEN=$(echo -n "${HASH}_session_fixed" | sha256sum | awk '{print $1}')

            cat > docs/auth-config.js << AUTHEOF
          var AUTH_CONFIG = {
            disabled: false,
            password_hash: "${HASH}",
            session_token: "${TOKEN}",
            generated_at: "$(date -Iseconds)"
          };
          AUTHEOF
            echo "auth-config.js generated (fixed session token)"
          fi

          echo "=== auth-config.js validation ==="
          if [ -f docs/auth-config.js ]; then
            FILE_SIZE=$(wc -c < docs/auth-config.js)
            echo "File size: ${FILE_SIZE} bytes"
            if [ "$FILE_SIZE" -lt 10 ]; then
              echo "::error::auth-config.js is too small, generation may have failed"
              exit 1
            fi
            echo "Content preview:"
            head -c 200 docs/auth-config.js
            echo ""
          else
            echo "::error::auth-config.js was not created"
            exit 1
          fi

      - name: Verify required auth files exist
        run: |
          set -e
          echo "Checking required files..."
          for f in docs/auth-config.js docs/auth.js docs/login.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done
          echo "All auth files verified."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
