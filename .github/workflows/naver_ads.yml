name: Naver Ads Data Collector

on:
  workflow_dispatch:

  schedule:
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Collect Naver Ads Data (Multi-Store)
        env:
          # 본부 (기존)
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          # 본점
          NAVER_AD_API_KEY_BONJEOM: ${{ secrets.NAVER_AD_API_KEY_BONJEOM }}
          NAVER_AD_SECRET_KEY_BONJEOM: ${{ secrets.NAVER_AD_SECRET_KEY_BONJEOM }}
          NAVER_AD_CUSTOMER_ID_BONJEOM: ${{ secrets.NAVER_AD_CUSTOMER_ID_BONJEOM }}
          # 다산1호점
          NAVER_AD_API_KEY_DASAN: ${{ secrets.NAVER_AD_API_KEY_DASAN }}
          NAVER_AD_SECRET_KEY_DASAN: ${{ secrets.NAVER_AD_SECRET_KEY_DASAN }}
          NAVER_AD_CUSTOMER_ID_DASAN: ${{ secrets.NAVER_AD_CUSTOMER_ID_DASAN }}
          # 송파점
          NAVER_AD_API_KEY_SONGPA: ${{ secrets.NAVER_AD_API_KEY_SONGPA }}
          NAVER_AD_SECRET_KEY_SONGPA: ${{ secrets.NAVER_AD_SECRET_KEY_SONGPA }}
          NAVER_AD_CUSTOMER_ID_SONGPA: ${{ secrets.NAVER_AD_CUSTOMER_ID_SONGPA }}
          # 두정점
          NAVER_AD_API_KEY_DUJEONG: ${{ secrets.NAVER_AD_API_KEY_DUJEONG }}
          NAVER_AD_SECRET_KEY_DUJEONG: ${{ secrets.NAVER_AD_SECRET_KEY_DUJEONG }}
          NAVER_AD_CUSTOMER_ID_DUJEONG: ${{ secrets.NAVER_AD_CUSTOMER_ID_DUJEONG }}
        run: |
          python scripts/naver_ads_api.py

      - name: Create AI Config
        run: |
          cat > docs/ai-config.js << 'EOF'
          const AI_CONFIG = {
            AI_MODE: "direct",
            GEMINI_PROXY_URL: "",
            GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}",
            GEMINI_API_URL: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"
          };
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Update Naver Ads data (multi-store): $(date '+%Y-%m-%d %H:%M') KST"
          git push || echo "Nothing to push"
