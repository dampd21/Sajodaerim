name: Baemin Review Crawler

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - initial
          - current_year

jobs:
  crawl:
    runs-on: [self-hosted, baemin]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout 이 이미 safe.directory 처리해주므로 삭제해도 됩니다.

      - name: Pull latest changes (best-effort)
        run: git pull origin main --rebase
        continue-on-error: true

      - name: Install dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install selenium webdriver-manager requests

      - name: Run crawler
        env:
          CRAWL_MODE: ${{ github.event.inputs.mode || 'daily' }}
          BAEMIN_ID_MAIN: ${{ secrets.BAEMIN_ID_MAIN }}
          BAEMIN_PWD_MAIN: ${{ secrets.BAEMIN_PWD_MAIN }}
          BAEMIN_ID_DASAN: ${{ secrets.BAEMIN_ID_DASAN }}
          BAEMIN_PWD_DASAN: ${{ secrets.BAEMIN_PWD_DASAN }}
          BAEMIN_ID_SONGPA: ${{ secrets.BAEMIN_ID_SONGPA }}
          BAEMIN_PWD_SONGPA: ${{ secrets.BAEMIN_PWD_SONGPA }}
          BAEMIN_ID_DUJEONG: ${{ secrets.BAEMIN_ID_DUJEONG }}
          BAEMIN_PWD_DUJEONG: ${{ secrets.BAEMIN_PWD_DUJEONG }}
        run: python scripts/baemin_review_crawler.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/review_baemin_data.json

          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $ts = Get-Date -Format "yyyy-MM-dd HH:mm"
            git commit -m "Update baemin reviews - $ts"
          } else {
            Write-Host "No changes to commit."
          }

          git pull origin main --rebase
        continue-on-error: true

      - name: Push
        run: git push
