name: Baemin Review Crawler

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - initial
          - current_year
      store:
        description: '지점 선택 (initial은 all 금지)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - main
          - dasan
          - songpa
          - dujeong

permissions:
  contents: write

concurrency:
  group: baemin-review-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare (validate & matrix)
    runs-on: ubuntu-latest
    outputs:
      stores: ${{ steps.set.outputs.stores }}
      mode: ${{ steps.set.outputs.mode }}
    steps:
      - id: set
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          STORE="${{ github.event.inputs.store || 'all' }}"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # initial 모드에서는 all 금지
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MODE" == "initial" && "$STORE" == "all" ]]; then
            echo "::error::initial 모드에서는 store=all 실행을 금지합니다. main/dasan/songpa/dujeong 중 하나를 선택해서 실행하세요."
            exit 1
          fi

          # workflow_dispatch + store 단일 선택이면 1개만
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$STORE" != "all" ]]; then
            echo "stores=[\"$STORE\"]" >> "$GITHUB_OUTPUT"
          else
            # schedule 또는 store=all이면 4지점 순차 실행
            echo 'stores=["main","dasan","songpa","dujeong"]' >> "$GITHUB_OUTPUT"
          fi

  crawl:
    name: Crawl - ${{ matrix.store }}
    needs: prepare
    runs-on: [self-hosted, baemin]

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        store: ${{ fromJSON(needs.prepare.outputs.stores) }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Ensure main branch (avoid detached HEAD issues)
        run: |
          chcp 65001>nul
          git fetch origin main
          git checkout -B main origin/main

      - name: Show Python/Pip
        run: |
          chcp 65001>nul
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          chcp 65001>nul
          python -m pip install --upgrade pip
          python -m pip install selenium webdriver-manager

      - name: Cleanup stale chrome/chromedriver (best-effort, never fail)
        continue-on-error: true
        run: |
          chcp 65001>nul
          for %%P in (chromedriver.exe chrome.exe) do (
            taskkill /F /IM %%P /T >nul 2>nul
            if errorlevel 1 (
              echo %%P not running
            ) else (
              echo %%P killed
            )
          )
          exit /b 0

      - name: Run crawler (per-store)
        env:
          PYTHONUTF8: "1"
          CHROME_PROFILE_BASE: "C:\\actions-runner\\_chrome_profiles"

          # 속도 (원하면 더 늦춰도 됨)
          API_SLEEP_SEC: "1.2"
          STORE_COOLDOWN_SEC: "6"
          API_LIMIT: "50"

          CRAWL_MODE: ${{ needs.prepare.outputs.mode }}
          TARGET_STORE: ${{ matrix.store }}

          BAEMIN_ID_MAIN: ${{ secrets.BAEMIN_ID_MAIN }}
          BAEMIN_PWD_MAIN: ${{ secrets.BAEMIN_PWD_MAIN }}
          BAEMIN_ID_DASAN: ${{ secrets.BAEMIN_ID_DASAN }}
          BAEMIN_PWD_DASAN: ${{ secrets.BAEMIN_PWD_DASAN }}
          BAEMIN_ID_SONGPA: ${{ secrets.BAEMIN_ID_SONGPA }}
          BAEMIN_PWD_SONGPA: ${{ secrets.BAEMIN_PWD_SONGPA }}
          BAEMIN_ID_DUJEONG: ${{ secrets.BAEMIN_ID_DUJEONG }}
          BAEMIN_PWD_DUJEONG: ${{ secrets.BAEMIN_PWD_DUJEONG }}
        run: |
          chcp 65001>nul
          python -X utf8 scripts/baemin_review_crawler.py

      - name: Commit and push
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          chcp 65001>nul
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/review_baemin_data.json

          for /f %%i in ('powershell -NoProfile -Command "Get-Date -Format ""yyyy-MM-dd HH:mm"""') do set TS=%%i
          git diff --staged --quiet || git commit -m "Update baemin reviews - %TS% - ${{ matrix.store }}"

          git pull origin main --rebase || echo pull skipped
          git push || (git pull origin main --rebase && git push)
