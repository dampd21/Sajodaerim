name: Baemin Review Crawler

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - initial
          - current_year
      store:
        description: '지점 선택'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - main
          - dasan
          - songpa
          - dujeong

permissions:
  contents: write

concurrency:
  group: baemin-review-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl - ${{ matrix.store }}
    runs-on: [self-hosted, baemin]

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        store: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && github.event.inputs.store != 'all'
          && format('["{0}"]', github.event.inputs.store)
          || '["main","dasan","songpa","dujeong"]'
        ) }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes (best-effort)
        run: git pull origin main --rebase
        continue-on-error: true

      - name: Show Python/Pip
        run: |
          chcp 65001>nul
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          chcp 65001>nul
          python -m pip install --upgrade pip
          python -m pip install selenium webdriver-manager

      - name: Cleanup stale chrome/chromedriver (best-effort)
        run: |
          chcp 65001>nul
          taskkill /F /IM chromedriver.exe /T >nul 2>nul || echo chromedriver not running
          taskkill /F /IM chrome.exe /T >nul 2>nul || echo chrome not running

      - name: Run crawler (per-store)
        env:
          PYTHONUTF8: "1"
          CHROME_PROFILE_BASE: "C:\\actions-runner\\_chrome_profiles"

          # 속도(필요시 조절)
          API_SLEEP_SEC: "1.2"
          STORE_COOLDOWN_SEC: "6"
          API_LIMIT: "50"

          CRAWL_MODE: ${{ github.event.inputs.mode || 'daily' }}
          TARGET_STORE: ${{ matrix.store }}

          BAEMIN_ID_MAIN: ${{ secrets.BAEMIN_ID_MAIN }}
          BAEMIN_PWD_MAIN: ${{ secrets.BAEMIN_PWD_MAIN }}
          BAEMIN_ID_DASAN: ${{ secrets.BAEMIN_ID_DASAN }}
          BAEMIN_PWD_DASAN: ${{ secrets.BAEMIN_PWD_DASAN }}
          BAEMIN_ID_SONGPA: ${{ secrets.BAEMIN_ID_SONGPA }}
          BAEMIN_PWD_SONGPA: ${{ secrets.BAEMIN_PWD_SONGPA }}
          BAEMIN_ID_DUJEONG: ${{ secrets.BAEMIN_ID_DUJEONG }}
          BAEMIN_PWD_DUJEONG: ${{ secrets.BAEMIN_PWD_DUJEONG }}
        run: |
          chcp 65001>nul
          python -X utf8 scripts/baemin_review_crawler.py

      - name: Commit and push
        run: |
          chcp 65001>nul
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/review_baemin_data.json

          for /f %%i in ('powershell -NoProfile -Command "Get-Date -Format ""yyyy-MM-dd HH:mm"""') do set TS=%%i
          git diff --staged --quiet || git commit -m "Update baemin reviews - %TS% - ${{ matrix.store }}"

          git pull origin main --rebase || echo pull skipped
          git push
